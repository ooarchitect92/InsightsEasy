# Optional provider access. Credentials stay out of the repository and UI.
services:
  crm-actions:
    environment:
      PROVIDER_BINDINGS_FILE: /run/providers/bindings.json
    volumes:
      - type: bind
        source: ${CRM_PROVIDER_BINDINGS_FILE:?Set absolute path to owner-scoped CRM binding file}
        target: /run/providers/bindings.json
        read_only: true
        bind: {create_host_path: false}
  activation-actions:
    environment:
      PROVIDER_BINDINGS_FILE: /run/providers/bindings.json
    volumes:
      - type: bind
        source: ${ACTIVATION_PROVIDER_BINDINGS_FILE:?Set absolute path to owner-scoped activation binding file}
        target: /run/providers/bindings.json
        read_only: true
        bind: {create_host_path: false}
